services:
  - type: web
    name: memoryos-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python core/seed_demo.py && uvicorn core.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MEMORYOS_DB_PATH
        value: /tmp/memories.db
      - key: PYTHON_VERSION
        value: 3.11.11
